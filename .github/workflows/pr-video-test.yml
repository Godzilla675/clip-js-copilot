name: PR Video Edit Tests

on:
  pull_request:
    branches: ['*']

permissions:
  contents: read

jobs:
  video-edit-tests:
    name: Video Editing E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run video editing E2E tests
        run: pnpm --filter @ai-video-editor/tests test:e2e
